tooltips:
  Incident management:
    desc: "A standard process for managing technical incidents — what happens when something breaks, who is responsible, and how it is resolved."
    prompts:
      - "Who is the first person called when AAP has a problem at 2am on a Sunday?"
      - "Walk me through the last significant incident — how was it handled, and what would you do differently?"
      - "If a new engineer joined tomorrow, how would they know what to do during an incident?"

  Life cycle management:
    desc: "Communicating when the platform will be updated. At minimum, adopt the Red Hat AAP life cycle plan as your starting point."
    prompts:
      - "Does your organisation know when your current AAP version goes end-of-life?"
      - "Who gets told when a major platform upgrade is planned, and how far in advance?"
      - "What happened the last time AAP was upgraded — was it planned, or did it catch people by surprise?"

  "Backup & recovery":
    desc: "A process for performing backups and recovering from them. Life cycle management and incident management both depend on this."
    prompts:
      - "If your AAP cluster failed right now, how long would it take to restore service?"
      - "Has your backup process ever been tested by actually restoring from it?"
      - "Who is responsible for running backups? Is that manual or automated?"

  Upgrading:
    desc: "A defined process for performing platform upgrades, including the RHEL or OpenShift upgrades that underpin AAP."
    prompts:
      - "What approval gates are required before an AAP upgrade can happen?"
      - "What is your smoke test after an upgrade completes? How do you know it was successful?"
      - "What is the rollback plan if an upgrade goes wrong halfway through?"

  Capacity management:
    desc: "Monitoring platform capacity and acting when expansion is needed. At MVP this process is typically manual."
    prompts:
      - "How would you know today if your AAP cluster was running out of capacity?"
      - "Who decides when to add more execution nodes — and what triggers that decision?"
      - "Do you have current visibility into job queue depth or execution node load?"

  Disaster recovery:
    desc: "A tested process for recovering from major failures — including complete loss of the platform. Essential once significant automation is running through AAP."
    prompts:
      - "If your AAP cluster was completely destroyed tonight, what would happen tomorrow morning?"
      - "Has your DR process ever been tested by a real exercise? What did you learn?"
      - "What is your recovery time objective — and does your current DR capability actually meet it?"

  Integration process:
    desc: "A formal process for managing incoming and outgoing API integrations with AAP — typically involving some form of API management."
    prompts:
      - "How many external systems currently integrate with AAP — do you know the full list?"
      - "What happens when an integration breaks — who is notified, who owns the fix?"
      - "How do you prevent ad-hoc integrations from creating a spaghetti architecture?"

  Basic onboarding:
    desc: "Simple, manual onboarding for new teams: creating LDAP groups, AAP organisations, git repos, and providing access to the landing page."
    prompts:
      - "Walk through your current onboarding process step by step — what does it involve?"
      - "How long does it take from a team requesting access to running their first job in AAP?"
      - "Has a team ever given up or gone around the process because onboarding took too long?"

  LDAP group creation:
    desc: "Creating dedicated LDAP/AD groups for each team as part of onboarding, used to drive AAP organisation membership and access."
    prompts:
      - "Who currently creates LDAP groups for a new team, and how long does that take?"
      - "Is there a standard naming convention for onboarding-related LDAP groups?"
      - "What happens if an LDAP group is requested but never gets created — does onboarding stall?"

  AAP organisation setup:
    desc: "Manually creating a new AAP organisation for each onboarded team, including initial settings and structure."
    prompts:
      - "Who has the access and knowledge to create a new AAP organisation today?"
      - "What does a newly created organisation look like before any team-specific configuration is added?"
      - "How long does it typically take to set up a new organisation from request to ready-to-use?"

  Onboarding Team:
    desc: "The people responsible for running the onboarding process — triaging requests, performing the manual setup steps, and supporting new teams through their first jobs."
    prompts:
      - "Who currently owns onboarding — is it a named team, or whoever has time?"
      - "How many onboarding requests are handled in a typical month, and by how many people?"
      - "What happens to onboarding when the person who usually does it is unavailable?"

  Landing Page Access:
    desc: "Providing new teams with access to the platform landing page as part of onboarding, so they have a starting point for documentation and resources."
    prompts:
      - "Is granting landing page access a manual step, or does every new user get it automatically?"
      - "Do new teams know the landing page exists, or do they find out by asking someone?"
      - "What is on the landing page that a brand-new team needs on day one?"

  Internal Onboarding Training and Processes:
    desc: "The documented internal process and training materials that walk a new team through what onboarding involves and what is expected of them."
    prompts:
      - "Is your onboarding process written down anywhere, or does it live in one person's head?"
      - "What training do new teams receive as part of onboarding today?"
      - "Has a new team ever been onboarded inconsistently because the process wasn't followed the same way twice?"

  Streamlined onboarding:
    desc: "Replacing manual onboarding steps with automation — reducing wait times, eliminating configuration errors, and enabling higher throughput."
    prompts:
      - "Which steps of your current onboarding are the most error-prone or time-consuming?"
      - "What is the current onboarding lead time? What would 'instant' look like to a new team?"
      - "If you could automate just one step this quarter, which would have the biggest impact?"

  Self-service LDAP/group provisioning:
    desc: "Allowing teams to request and provision their own LDAP/AD groups through a self-service workflow, removing the manual creation step."
    prompts:
      - "What would it take to let a team request their own access group without raising a ticket?"
      - "Who would need to approve self-service group creation, and how would that approval be automated?"
      - "Has a manual LDAP request ever been the longest step in onboarding a new team?"

  AAP organisation automation:
    desc: "Creating new AAP organisations automatically via the API or infra.controller_configuration, instead of manual configuration in the UI."
    prompts:
      - "Could a new AAP organisation be created today without anyone logging into the UI?"
      - "What organisation settings are always the same for every new team — and could those be templated?"
      - "What would break if organisation creation were fully automated tomorrow?"

  Automated repo & project scaffolding:
    desc: "Automatically creating a new team's git repository and AAP project from a standard template as part of onboarding."
    prompts:
      - "Do new teams start from a blank repo, or from a scaffolded template with the right structure already in place?"
      - "How much manual repo setup happens today that could be templated instead?"
      - "Who maintains the scaffolding template, and how often does it get used?"

  One-click onboarding workflow:
    desc: "Combining all onboarding steps into a single automated workflow — one job template or pipeline that provisions everything a new team needs."
    prompts:
      - "If onboarding were a single button press, what would still need to happen outside of it?"
      - "How many separate manual steps would need to be combined to make this possible?"
      - "Who would be responsible for maintaining the onboarding workflow once it exists?"

  Onboarding request portal:
    desc: "A self-service front end where teams can request onboarding, track its progress, and see what is expected of them — rather than emailing or messaging the platform team directly."
    prompts:
      - "How do teams currently request onboarding — a ticket, an email, a Slack message?"
      - "Would a team know how far through onboarding they are if they asked today?"
      - "What information would a request portal need to collect to fully automate the workflow behind it?"

  Training assessment:
    desc: "When onboarding new teams, assess what type of training they need — DevOps fundamentals, Ansible specifics, or both."
    prompts:
      - "What is the biggest skill gap you observe in new automation developers?"
      - "Do you currently assess training needs before onboarding, or do you find out afterwards?"
      - "Have you ever onboarded a team that struggled badly because they lacked foundational skills?"

  Skills survey / intake questionnaire:
    desc: "A short questionnaire completed during onboarding to gauge a new team's existing automation and DevOps experience."
    prompts:
      - "Do you currently ask new teams about their experience level before onboarding them?"
      - "What questions would tell you the most about whether a team needs extra support?"
      - "Who would review the survey results and decide what happens next?"

  DevOps fundamentals track:
    desc: "A training track covering foundational DevOps concepts — version control, CI/CD, infrastructure as code — for teams that need it before diving into Ansible specifics."
    prompts:
      - "How often do you onboard a team that is missing basic DevOps fundamentals?"
      - "Does fundamentals training exist today, or would it need to be built from scratch?"
      - "Who would deliver this training, and how much of their time would it take?"

  Ansible specifics track:
    desc: "A training track focused specifically on Ansible and AAP — module usage, playbook structure, and platform conventions specific to your organisation."
    prompts:
      - "What Ansible-specific knowledge do new developers most often lack?"
      - "Is there existing Ansible training content that could be reused for this track?"
      - "How would you measure whether this training track was actually effective?"

  Skill gap review meeting:
    desc: "A short meeting following the skills survey to discuss the results with a new team and agree on a training plan before they start building automation."
    prompts:
      - "Who would be in the room for a skill gap review — the platform team, the new team's lead, both?"
      - "What would happen differently for a team with a big skill gap versus one with none?"
      - "Has skipping this kind of conversation ever led to problems further into onboarding?"

  Skills-based onboarding:
    desc: "Differentiating the onboarding path for experienced versus inexperienced automation developers — accelerating time-to-value for those who need less guidance."
    prompts:
      - "Do you currently adapt your onboarding based on the experience level of the person?"
      - "Has a one-size-fits-all onboarding ever frustrated an experienced developer or overwhelmed a beginner?"
      - "What does 'experienced enough for the fast track' look like in practical terms?"

  Fast-track path for experienced developers:
    desc: "A shortened onboarding path for teams or individuals who already have strong automation experience, skipping foundational training they don't need."
    prompts:
      - "What would qualify someone for the fast-track path — a certification, a test, a manager's word?"
      - "Has an experienced developer ever been frustrated by being forced through standard onboarding?"
      - "How much shorter would the fast-track path be compared to standard onboarding?"

  Guided path for new developers:
    desc: "A more hands-on onboarding path for less experienced developers, with extra checkpoints, training, and support before they are working independently."
    prompts:
      - "What extra support does a less experienced developer need that an experienced one doesn't?"
      - "How do you currently identify who needs the guided path versus the fast track?"
      - "What does 'working independently' look like at the end of the guided path?"

  Mentorship pairing:
    desc: "Pairing a new, less experienced developer with an experienced mentor during onboarding to accelerate their ramp-up and answer questions in real time."
    prompts:
      - "Do you have people who would be good mentors, and do they have capacity for it?"
      - "How would a mentor and mentee be paired — randomly, by team, by interest?"
      - "Has informal mentoring already been happening without anyone calling it that?"

  Tiered access (sandbox before production):
    desc: "Giving newly onboarded developers access to a sandbox environment first, with production access granted only once they've demonstrated competence."
    prompts:
      - "Do new developers currently get production access immediately, or is there a safer way in first?"
      - "What would a sandbox environment need to look like to be a realistic practice space?"
      - "Who decides when someone is ready to move from sandbox to production access?"

  Documentation:
    desc: "A requirement that automation is documented — what it does, how to use it, and how to maintain it."
    prompts:
      - "What percentage of automation in your environment has meaningful documentation?"
      - "Has anyone ever had to reverse-engineer automation because the original author had left?"
      - "What is the minimum documentation standard you would enforce on a merge request?"

  Coding standards:
    desc: "A standard for how Ansible automation is written — naming, structure, linting. Ansible-lint can serve as the arbiter of acceptable code."
    prompts:
      - "Are there written standards for how Ansible should be written in your organisation?"
      - "How are standards currently enforced — through review, tooling, or just trust?"
      - "If ansible-lint was run against your entire codebase today, what would you expect to find?"

  Automation integration:
    desc: "A process for approving new automation use cases — bringing together requestors, automation experts, and security teams to prevent blanket refusals."
    prompts:
      - "What happens when a team wants to automate something that touches another team's systems?"
      - "Has automation ever been blocked by a blanket 'no' from security? How was it resolved?"
      - "Who has the authority to sign off that a new automation use case is acceptable?"

  Change management:
    desc: "Ensuring the change management process supports automation — including allowing automated changes to bypass slow manual gates when testing is sufficient."
    prompts:
      - "Does your change management process allow automated changes, or does everything need human sign-off?"
      - "Has a slow change process ever killed momentum on an automation project?"
      - "What evidence would your change management team need to approve an automated change category?"

  CI/CD:
    desc: "Automated continuous integration and delivery for Ansible automation — linting, testing, and deploying through a pipeline."
    prompts:
      - "What does your current CI/CD pipeline for Ansible look like — what stages does it have?"
      - "Who owns and maintains the CI/CD pipeline for automation?"
      - "Has a broken pipeline ever blocked a critical automation deployment?"

  Complete test coverage:
    desc: "Every line of Ansible automation has unit, functional, and integration test coverage — high investment, high confidence."
    prompts:
      - "What would it take to have complete test coverage for all automation in your environment?"
      - "How would you introduce a complete test coverage requirement without it becoming an adoption blocker?"
      - "Which automation is most critical and most deserving of comprehensive test coverage right now?"

  Integrated dev platform:
    desc: "A developer portal (e.g. Backstage) that guides automation developers through scaffolding, templates, and golden paths."
    prompts:
      - "What is the biggest friction point for someone starting a new automation project from scratch?"
      - "How much do your developers need to know before they can write and ship their first role?"
      - "What would 'zero to running automation in 30 minutes' look like for a new developer?"

  Availability:
    desc: "Designing the platform to meet availability requirements. Reference the Red Hat tested topologies for appropriate deployment models."
    prompts:
      - "What is your current uptime target for AAP — and is that written down anywhere?"
      - "What automation currently runs through AAP? What breaks if the platform goes down for an hour?"
      - "Is your current deployment topology appropriate for the criticality of what runs on it?"

  Security:
    desc: "Designing the platform with security requirements in mind — OS hardening, network planning, and basic access controls."
    prompts:
      - "What security controls does your organisation require for any new platform — and have those been applied to AAP?"
      - "Has the platform been through a formal security review? What were the findings?"
      - "How is privileged access to AAP managed — who has admin rights, and how is that reviewed?"

  Monitoring:
    desc: "Basic monitoring to ensure platform availability and security — alerts on key thresholds for job failures, resource usage, and login activity."
    prompts:
      - "What monitoring exists for AAP today, and who gets the alerts?"
      - "If AAP silently started failing jobs at 3am, how long would it be before someone noticed?"
      - "Are there metrics you wish you had visibility into that you currently do not?"

  Multi-cluster:
    desc: "Operating multiple AAP clusters kept in sync using infra.controller_configuration — providing near-zero RTO and geographic redundancy."
    prompts:
      - "What would a complete AAP cluster failure mean for your business operations right now?"
      - "What availability requirement would justify the investment in a multi-cluster architecture?"
      - "How mature does your CasC implementation need to be before multi-cluster becomes viable?"

  Advanced security:
    desc: "Advanced security across the entire AAP stack — highly granular RBAC, hardened infrastructure, signed artifacts, and audited access."
    prompts:
      - "What would 'complete confidence in the security of our automation platform' look like to your security team?"
      - "Has the security of the automation platform ever been questioned by an audit or security review?"
      - "What would you need to implement to satisfy the most demanding security requirement in your organisation?"

  EDA standard source:
    desc: "Standardising how Event Driven Ansible receives events — using platforms like Kafka, ITSM, SIEM, or monitoring systems as canonical event sources."
    prompts:
      - "Which systems would you standardise as event sources for EDA in your environment?"
      - "Are there competing event-driven approaches that could be consolidated onto EDA?"
      - "What volume of events would your environment generate, and can your current EDA setup handle that?"

  Automated operations:
    desc: "Capacity management, availability, and security managed by automated workflows — no human intervention required for routine platform operations."
    prompts:
      - "Which operational tasks on your platform still require a human to log in and do something manually?"
      - "What is your confidence threshold before you trust automation to take a remediation action without a human?"
      - "What would 'lights-out platform operations' mean for your team's working day?"

  Git:
    desc: "Version control as the foundation of automation development. Git is the industry standard — all automation should be built around it."
    prompts:
      - "Is all automation code currently in version control? If not, where does it live?"
      - "What branching strategy do your teams use, and is it consistent across teams?"
      - "How is code reviewed before it reaches production?"

  Git organisation:
    desc: "How automation repositories are organised in your version control system — groupings, naming conventions, access patterns."
    prompts:
      - "If I wanted to find the automation for a specific team or use case, how would I navigate your git structure?"
      - "Is there a naming convention for repositories, or did each team decide for themselves?"
      - "Has a disorganised git structure ever caused a real problem — duplication, confusion, or lost work?"

  Best practice repos:
    desc: "Standard reference repositories that show teams how automation should be structured and documented — a golden path for new developers."
    prompts:
      - "Do you have a 'gold standard' example that new automation developers are pointed to?"
      - "When someone writes their first Ansible role, what do they use as a template?"
      - "Who maintains the gold standard repo? Unowned examples go stale quickly."

  IDE:
    desc: "Standardising the development environment for writing Ansible — including IDE plugins for linting, syntax highlighting, and documentation. VS Code with the Red Hat Ansible extension is most common."
    prompts:
      - "What do your automation developers use to write Ansible today — is there a recommended setup?"
      - "How long does it take a new developer to get a working, properly configured development environment?"
      - "Has an IDE or editor difference ever caused a problem — a file encoding issue, a YAML indentation difference?"

  CI/CD platform:
    desc: "A standardised CI/CD platform for building and deploying automation, with shared pipeline templates that teams can start from."
    prompts:
      - "Which CI/CD platform is standard in your organisation — and has it been configured with Ansible-specific templates?"
      - "Who maintains the shared pipeline templates — and how are they kept up to date?"
      - "What would need to change for every new project to start with a working CI pipeline by default?"

  Molecule testing:
    desc: "Using Molecule to write and run automated tests for Ansible roles — ensuring automation is correct before deployment."
    prompts:
      - "Have any of your teams written Molecule tests? What was the experience?"
      - "If a role was changed today, how would you know whether it had broken something?"
      - "What is the most common failure mode for automation in your environment — and could a test have caught it?"

  EE builds:
    desc: "Building custom Ansible Execution Environments with required collections and dependencies — versioned and stored in a registry."
    prompts:
      - "How do your teams manage Ansible dependencies today — do they use standard or custom EEs?"
      - "Has a dependency conflict or missing collection ever broken automation in production?"
      - "How do you ensure that the EE used in development is the same one used in production?"

  Security gates:
    desc: "Security checks integrated into the CI/CD pipeline — code signing, EE vulnerability scanning, and artifact signing."
    prompts:
      - "What security checks currently exist in your automation development workflow?"
      - "Has automation ever introduced a security vulnerability — a hard-coded credential, an insecure module argument?"
      - "Who in your security team has visibility into what automation content is being deployed to production?"

  "Standardised deploy.":
    desc: "A consistent approach to promoting automation from development to production — using separate test and production environments, organisations, or branches."
    prompts:
      - "How does automation currently get promoted from development to production?"
      - "Has 'works in dev, fails in prod' ever happened — and why?"
      - "Who approves a production deployment — and is that gate manual or automated?"

  Custom features:
    desc: "Developing custom AAP extensions — inventory plugins, authentication plugins, custom collections — to meet specific organisational requirements not covered by defaults."
    prompts:
      - "Are there capabilities you need from AAP that do not exist out of the box?"
      - "How do you decide whether to build a custom feature versus finding a community alternative?"
      - "Who would own and maintain custom-built features — and is that sustainable?"

  Organisations:
    desc: "Design decision: how to use AAP organisations. One team per organisation is a popular choice that simplifies RBAC and reduces blast radius."
    prompts:
      - "How is your AAP currently structured into organisations — and why?"
      - "If a team's automation broke, how would it be contained from affecting others?"
      - "Were the organisation design decisions documented, or are they held in people's heads?"

  Projects:
    desc: "How to use projects in AAP — sync on launch, branch strategies, and how projects relate to git repositories."
    prompts:
      - "How do your teams use projects in AAP? Is there a consistent standard?"
      - "Who manages project sync settings — the platform team or each team independently?"
      - "Has a project sync failure ever impacted a production automation run?"

  Inventories:
    desc: "How to use inventories in AAP — static vs dynamic, who creates and owns them, and naming conventions."
    prompts:
      - "How do different teams manage their inventories? Is there a standard or free-for-all?"
      - "Are inventories static or dynamic? What is the source of truth for host data?"
      - "Has an incorrect inventory ever caused automation to run against the wrong hosts?"

  Credentials:
    desc: "How to use credentials in AAP — should everyone use a central credentials store, or can teams use locally defined credentials?"
    prompts:
      - "How are credentials currently managed — centrally or per-team?"
      - "Has a credential ever been shared in a way that created a security concern?"
      - "What is your approach to rotating credentials used in automation?"

  Secrets:
    desc: "How to hide secret information in Ansible automation — Ansible Vaults or a central secrets store such as HashiCorp Vault."
    prompts:
      - "How are secrets currently stored in your automation — Vault, a secrets manager, or something else?"
      - "Has a secret ever been accidentally committed to a git repository?"
      - "Who has access to the secrets used by automation in production?"

  Templates:
    desc: "How to use job templates in AAP — naming conventions, standard settings, and what should be standardised across all teams."
    prompts:
      - "Is there a naming convention for job templates in your AAP — or did each team decide for themselves?"
      - "What template settings are currently inconsistent across teams?"
      - "How do users discover which templates are available to them?"

  RBAC:
    desc: "How to configure Role Based Access Control in AAP — connecting LDAP groups to roles, minimising privilege, and making access auditable."
    prompts:
      - "How is RBAC currently configured — who did the design, and is it documented?"
      - "Does every user have only the access they need, or is over-provisioning common?"
      - "How do you handle access reviews — when someone leaves, how quickly is access removed?"

  Example organisation:
    desc: "An AAP organisation set up to demonstrate best practices — standard naming, RBAC, project structure — that teams can reference and emulate as a golden path."
    prompts:
      - "Do you have a 'show me how it should look' reference environment that teams are pointed to?"
      - "When a team is unsure how to structure something in AAP, where do they go for guidance?"
      - "Who maintains the example organisation? Unowned examples become anti-patterns."

  Event Driven Ansible:
    desc: "Introducing EDA — defining standards for how events are consumed and acted upon by the platform, and which systems are authorised event sources."
    prompts:
      - "Are there use cases where you want automation to respond to events rather than be triggered manually?"
      - "What events are currently happening in your environment that could trigger automated remediation?"
      - "What is the confidence threshold before you trust automation to respond without a human in the loop?"

  AAP as code:
    desc: "Using infra.controller_configuration to define all AAP configuration as code — organisations, credentials, templates — version-controlled and peer-reviewed."
    prompts:
      - "If your AAP cluster had to be rebuilt from scratch today, how long would it take to restore all configuration?"
      - "Is any of your current AAP configuration only in the UI, with no code representation?"
      - "What would you tackle first if you were starting to implement configuration as code for AAP?"

  Landing page:
    desc: "A starting point for new platform users — typically a wiki or internal web page with documentation, process descriptions, and useful links."
    prompts:
      - "Where does a brand-new team go on day one? Is that destination obvious and findable?"
      - "Who owns the landing page today? When was it last updated?"
      - "What questions do new users ask most often — and are the answers on the landing page?"

  Platform docs:
    desc: "Documentation describing how the platform works — its architecture, configuration choices, and how-to guides for platform users."
    prompts:
      - "If your most experienced platform engineer left tomorrow, could someone else maintain the platform using existing docs?"
      - "What is currently not documented that probably should be?"
      - "Has incorrect or missing documentation ever caused an incident or significant delay?"

  Link collection:
    desc: "A curated list of useful links for new platform users — Red Hat documentation, internal wikis, training resources, community pages."
    prompts:
      - "What are the five links every new AAP user should have bookmarked — and are they in one place?"
      - "Who maintains your link collection today, and how often is it reviewed?"
      - "Are there links that show up repeatedly in team chat that should be in a central collection?"

  FAQ:
    desc: "A Frequently Asked Questions section as part of the onboarding page — capturing the most common questions and saving platform team time."
    prompts:
      - "What are the five questions you get asked most often by new platform users?"
      - "Is there a self-service way for users to find answers, or do they always ask a person?"
      - "Who updates the FAQ — and does it keep pace with platform changes?"

  Learning path:
    desc: "A documented learning path for new platform users — how to get started, what training is available, and what to do first."
    prompts:
      - "If someone joins your organisation today as an automation developer, what is their first week supposed to look like?"
      - "Have new starters ever felt lost or unsupported in their first weeks on the platform?"
      - "What resources do your most successful automation developers wish they had had when they started?"

  Internal training:
    desc: "Describing what internal training is available for automation developers — courses, workshops, mentoring, and self-service materials."
    prompts:
      - "What internal training currently exists for people being onboarded to the platform?"
      - "Is internal training documented and discoverable, or word-of-mouth?"
      - "Who delivers internal training — and how is that capacity managed?"

  External training:
    desc: "Pointing people to external training resources — paid and free Red Hat training, online labs, certification paths, and relevant books."
    prompts:
      - "What external training do you currently point new developers to?"
      - "Is there budget for paid Red Hat training — and is it used?"
      - "Do you have a preferred learning path combining internal and external resources?"

  SLA:
    desc: "Defining the SLA for the AAP platform — uptime commitments, support hours, and response times."
    prompts:
      - "What SLA does your organisation expect from internal platforms — and is AAP held to the same standard?"
      - "If AAP was down for four hours on a Tuesday afternoon, what would the business consequence be?"
      - "Is your current SLA realistic given your team size and architecture? Can you actually meet it?"

  OLA:
    desc: "An internal agreement between the platform team and other IT teams (networking, security, storage) that defines mutual support obligations."
    prompts:
      - "Which other IT teams does AAP depend on — networking, security, storage, identity?"
      - "Has a slow response from a dependent team ever extended an AAP outage?"
      - "What would a reasonable OLA with each dependent team look like?"

  Feature planning:
    desc: "Planning and prioritising platform capabilities across MVP, 2.0, and Advanced levels — communicating the platform roadmap to users."
    prompts:
      - "How do you currently decide what to build next on the platform?"
      - "Do platform users know what is coming? Is there a roadmap they can see?"
      - "Has a lack of feature planning ever led to wasted effort or conflicting priorities?"

  Success plan:
    desc: "A basic plan outlining what business KPIs the platform aims to impact, and how success will be measured over time."
    prompts:
      - "How do you define success for the AAP platform — what would the business consider a win after 12 months?"
      - "If a senior leader asked you to justify the investment in AAP, what would you say?"
      - "Are there KPIs being tracked today? If not, what would you start with?"

  KPIs:
    desc: "A document describing the KPIs that are monitored for the platform — separate from or as part of the overall success plan."
    prompts:
      - "What metrics do you currently track for the platform?"
      - "Are your KPIs connected to business outcomes, or just technical metrics?"
      - "How do you make the impact of automation visible to people outside the platform team?"

  Name:
    desc: "Giving your platform a catchy, memorable name that people can refer to — building identity around the automation programme."
    prompts:
      - "Does your automation platform have a name — something people refer to it as beyond 'AAP'?"
      - "What qualities would you want the platform's name to convey?"
      - "Has naming or branding helped build identity around a tool or programme in your organisation before?"

  Logo:
    desc: "A visual identity for the platform — a logo that appears on documentation, the landing page, and merchandise."
    prompts:
      - "Does your platform have a visual identity that people recognise?"
      - "Who would be involved in designing a logo — is that within reach for your team?"
      - "What impression should the logo give to someone seeing it for the first time?"

  Merchandise:
    desc: "Stickers, t-shirts, or digital badges that help make the platform visible and build community pride around automation."
    prompts:
      - "What kind of merchandise would actually motivate people in your organisation — not what you assume?"
      - "Do you have budget for small community recognition items?"
      - "Has merchandise or branded swag had a positive impact on adoption of anything in your organisation before?"

  Performance monitoring:
    desc: "Measuring the business impact of automation — connecting platform KPIs to business outcomes and executive-level metrics."
    prompts:
      - "Can you currently show a leadership number that proves the business value of automation?"
      - "What business KPIs does your CIO or CTO track — and how does automation connect to them?"
      - "What would you need to track to make the case for expanding the automation programme?"

  "Budget & ownership":
    desc: "The automation strategy is owned by top leadership, backed by dedicated budget, and aligned to the organisation's budget cycle."
    prompts:
      - "Who currently holds the budget for AAP — strategic investment or IT cost line?"
      - "What would it take for automation to have its own dedicated budget, separate from the ops budget?"
      - "When was the last time automation was discussed at a leadership meeting — and what was the outcome?"

  Tools strategy:
    desc: "A high-level strategy defining requirements for automation tools — setting principles without mandating specific products."
    prompts:
      - "Does your organisation have a position on which automation tools are approved — and who decides?"
      - "What would happen if a major vendor changed their licensing terms or discontinued a key product?"
      - "Are there multiple automation tools in use across different teams? Is that a problem?"

  Skills development:
    desc: "Aligning automation investment with a broader organisational strategy for skills development — ensuring people keep pace with the platform."
    prompts:
      - "Is there a skills development strategy for automation in your organisation — and how is it funded?"
      - "Is Ansible or AAP featured in your organisation's learning and development catalogue?"
      - "What happens when automation developers leave — how is their knowledge retained and transferred?"

  Key processes:
    desc: "The automation strategy sets high-level requirements for the collaborative processes needed to run and develop automation at scale."
    prompts:
      - "Which organisational processes are currently the biggest bottleneck for automation at scale?"
      - "Are the owners of those blocking processes aware of the impact they have on automation adoption?"
      - "What would you put in front of leadership as the top three process changes needed to unlock automation at scale?"

  Product owner:
    desc: "A dedicated person responsible for planning and developing the platform — the person who owns the operational model and drives maturity."
    prompts:
      - "Who currently owns the AAP platform — and are they empowered and funded to develop it?"
      - "Is platform ownership someone's full-time job, or a side responsibility on top of other work?"
      - "If the platform were a commercial product, would the current ownership model be acceptable?"

  Platform engineers:
    desc: "The people who build and maintain the platform — SREs, platform engineers, system administrators doing the technical heavy lifting."
    prompts:
      - "How many people currently work on the platform? Is that sufficient for the scale you are aiming for?"
      - "Are platform engineers spending most of their time fixing problems reactively, or building things proactively?"
      - "What would happen if your most experienced platform engineer left next month?"

  Architect:
    desc: "A dedicated architect ensuring AAP fits the broader IT architecture and making sound technical decisions at scale."
    prompts:
      - "Who makes architectural decisions for automation in your organisation — and is that role clearly defined?"
      - "When a new team wants to integrate with AAP, who evaluates the design and signs it off?"
      - "Has a lack of architectural oversight ever led to a technical problem that was expensive to fix?"

  Core team:
    desc: "The core team of the Community of Practice — typically the product owner and platform engineers, potentially joined by experienced community members."
    prompts:
      - "Who currently forms the core of your automation community?"
      - "Is there a clear distinction between those who lead the community and those who participate?"
      - "What responsibilities should the core team have that they do not currently own?"

  Members:
    desc: "The broader members of the Community of Practice — people from across the organisation who are interested in automation and the platform."
    prompts:
      - "Who are the natural first members of an automation community in your organisation?"
      - "What would motivate people to join and stay active in the community?"
      - "How do you identify and reach people who would benefit from being part of the community?"

  Chat channel:
    desc: "A dedicated chat channel where Community of Practice members can talk to each other, share knowledge, and ask questions."
    prompts:
      - "Is there currently an informal channel where automation enthusiasts talk to each other?"
      - "What would you use as the platform — Teams, Slack, Mattermost?"
      - "How do you keep a chat channel active and useful rather than just a place to post announcements?"

  Regular meeting:
    desc: "A recurring community meeting — every other week or weekly — where people share, learn, and interact with each other."
    prompts:
      - "Is there currently any regular meeting where automation practitioners come together?"
      - "What format would work best for your organisation — demo, Q&A, guest speaker?"
      - "How do you keep the agenda fresh so attendance stays strong over time?"

  Service owner:
    desc: "A dedicated service owner for the platform — potentially responsible for automation across the wider organisation at a business level."
    prompts:
      - "Is automation treated as a strategic service with dedicated ownership at leadership level?"
      - "Who currently represents automation in leadership conversations about IT strategy?"
      - "What decisions require leadership authority that the platform team currently cannot make alone?"

  Solution architects:
    desc: "Dedicated automation solution architects who accelerate adoption, help teams design automation, and sometimes deliver internal training."
    prompts:
      - "Where do teams go when they need expert help designing a complex automation workflow?"
      - "How much of your platform team's time is reactive support versus proactive enablement of new teams?"
      - "What would an 'embedded SA' model look like — an expert sitting with a team for a sprint?"

  Gamification:
    desc: "Using gamification — digital badges, leaderboards, contribution prizes — to motivate community participation and reward meaningful contributions."
    prompts:
      - "What currently motivates people to contribute to the automation community beyond their day job?"
      - "Have you seen gamification work well in another context in your organisation — what made it work?"
      - "What behaviours would you want to incentivise, and how would you measure them?"

  Domain channels:
    desc: "As the community grows, splitting chat channels and regular meetings by technical domain to maintain quality of conversation."
    prompts:
      - "At what size does a single community channel become too noisy to be useful?"
      - "Are there already informal sub-groups within your community organised around specific topics?"
      - "What domains would you split into first, based on where concentration of interest already is?"

  Contribution recognition:
    desc: "Celebrating community contributions with prizes, badges, or other recognition — making contributing feel worthwhile and visible."
    prompts:
      - "What contribution recognition would actually motivate people in your organisation?"
      - "Do you have budget for small community recognition items or digital badges?"
      - "Has contribution recognition had a positive impact on community engagement anywhere in your organisation?"


